name: consultoria_bananeira
description: Aplicativo da plataforma Consultoria Bananeira

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  http: ^1.6.0
  crypto: ^3.0.7
  image_picker: ^1.2.4
  flutter_secure_storage: ^11.2.0
  provider: ^6.1.5+1
  sqflite: ^2.4.5
  path: ^1.9.1
  geolocator: ^14.1.2
  path_provider: ^2.1.6
  lucide_icons_flutter: ^4.0.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#245C36"
  adaptive_icon_foreground: "assets/icon/banana_foreground.png"
